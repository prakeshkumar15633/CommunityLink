apiVersion: apps/v1
kind: Deployment
metadata:
  name: communitylink-deployment
  namespace: communitylink-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: communitylink
  template:
    metadata:
      labels:
        app: communitylink
    spec:
      containers:
        - name: communitylink-container
          image: communitylink-image:latest
          
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"

            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: communitylink-secrets
                  key: DB_URL

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: communitylink-secrets
                  key: DB_NAME

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: communitylink-secrets
                  key: SECRET_KEY
